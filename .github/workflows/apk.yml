name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler l'APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk Carnet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Carnet-apk
          path: Carnet.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Carnet ${{ github.run_number }}
          files: Carnet.apk
          make_latest: true
